[tox]
requires =
    tox>=4.51.1
    tox-uv-bare
env_list =
    lint-{ruff,pre-commit},
    typing-{mypy,pyright,ty,pyrefly},
    3.1{1-5}-{vanilla,pool,sqlalchemy,sqlalchemy-asyncio}-tests,
    coverage-{combine,report},
    docs-{build,doctests}


[pkgenv]
pass_env = SETUPTOOLS_SCM_PRETEND_VERSION


[testenv]
runner = uv-venv-lock-runner
package = wheel
wheel_build_env = .pkg
dependency_groups =
    tests: cov
extras =
    tests: prometheus
    tests: sentry
    pool: pool
    sqlalchemy: sqlalchemy
    asyncio: sqlalchemy-asyncio
commands =
    vanilla: coverage run -m pytest
    sqlalchemy: coverage run -m pytest tests/test_sqlalchemy.py
    sqlalchemy-asyncio: coverage run -m pytest tests/test_sqlalchemy_async.py
    pool: coverage run -m pytest tests/test_psycopg_pool.py


[testenv:coverage-combine]
base_python_file = .python-version
depends = *-tests
package = skip
dependency_groups = cov
commands = coverage combine

[testenv:coverage-report]
base_python_file = .python-version
depends = coverage-combine
dependency_groups = cov
package = skip
commands =
    coverage report
    coverage html


[testenv:lint-{ruff,pre-commit}]
base_python_file = .python-version
dependency_groups = lint
package = skip
commands =
    ruff: ruff check --fix --exit-non-zero-on-fix .
    ruff: ruff format --exit-non-zero-on-format .
    pre-commit: prek run --all-files {posargs}


[testenv:typing-{mypy,pyright,ty,pyrefly}]
dependency_groups =
    tests
    mypy: mypy
    pyright: pyright
    ty: ty
    pyrefly: pyrefly
extras =
    prometheus
    sentry
    pool
    sqlalchemy
    sqlalchemy-asyncio
commands =
    mypy: mypy src typing_tests
    pyright: pyright
    ty: ty check
    pyrefly: pyrefly check


[testenv:docs-doctests]
base_python_file = .python-version
dependency_groups = doctests
extras =
    pool
    sqlalchemy-asyncio
    prometheus
    sentry
commands =
    pytest docs README.md


# Build (and serve) the documentation site with Zensical.
# mkdocstrings reads the package, so the optional extras must be present.
[testenv:docs-{build,serve}]
base_python_file = .python-version
dependency_groups = docs
extras =
    pool
    sqlalchemy-asyncio
    prometheus
    sentry
commands =
    build: zensical build {posargs}
    serve: zensical serve {posargs}
